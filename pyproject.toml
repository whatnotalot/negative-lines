[project]
name = "negative-lines"
version = "0.1.0"
description = "AI agents that build an open dataset of negative photoresist formulations and design compliant new ones."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.7.2",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
negative-lines = "negative_lines.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negative_lines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call paid APIs and network tests fetch real patents: both excluded by default.
# Run them explicitly with `pytest -m live` / `pytest -m network`.
addopts = "-ra -m \"not live and not network\""
markers = [
    "live: calls a real LLM provider (paid, needs an API key); opt-in with -m live",
    "network: downloads real documents (e.g. Google Patents); opt-in with -m network",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# long Field descriptions are prompt text; the formatter handles the rest
ignore = ["E501"]
