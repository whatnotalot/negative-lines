[project]
name = "negative-lines"
version = "0.1.0"
description = "AI agents that build an open dataset of negative photoresist formulations and design compliant new ones."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-openai>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/negative_lines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# long Field descriptions are prompt text; the formatter handles the rest
ignore = ["E501"]
